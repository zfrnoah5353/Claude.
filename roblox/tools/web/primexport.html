<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script></head><body>
<script type="module">
import { loadPet } from './load.js';
const r3 = (v) => [+v.x.toFixed(4), +v.y.toFixed(4), +v.z.toFixed(4)];
const q4 = (q) => [+q.x.toFixed(5), +q.y.toFixed(5), +q.z.toFixed(5), +q.w.toFixed(5)];
window.prims = async (id) => {
  const F = await loadPet(id);
  const prims = F.prims.map((p) => {
    const o = { t: p.t, color: p.color, mat: p.mat || 'plastic', bone: p.bone };
    for (const k of ['size', 'pos', 'a', 'b', 'dir', 'normal']) if (p[k]) o[k] = r3(p[k]);
    if (p.quat) o.quat = q4(p.quat);
    for (const k of ['ra', 'rb', 'len', 'w', 'R', 'r', 'arc', 'teeth', 'thick']) if (p[k] !== undefined) o[k] = p[k];
    return o;
  });
  const bones = F.bones.map((b, i) => ({ name: i ? `${b.name}_${i}` : F.name, parent: b.parent, pivot: r3(b.pivot), spin: b.spin || null }));
  return JSON.stringify({ id, name: F.name, prims, bones, anims: F.anims, bobs: F.bobs || null });
};
document.title = 'ready';
</script></body></html>
