name: Construire ReviseIA (.exe Windows)

on:
  push:
    paths: ['app/**', '.github/workflows/build-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win portable nsis --x64 --publish never -c.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with:
          name: ReviseIA-Windows
          path: |
            app/dist/ReviseIA-Portable.exe
            app/dist/ReviseIA-Installation.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ReviseIA v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            **Télécharge `ReviseIA-Installation.exe`** (installe + raccourci bureau) ou `ReviseIA-Portable.exe` (rien à installer, double-clic).
            Puis sur le PC : ⚙️ Réglages → colle ta clé API Claude. Ensuite 📱 → scanne le QR code avec ton téléphone.
          files: |
            app/dist/ReviseIA-Portable.exe
            app/dist/ReviseIA-Installation.exe
