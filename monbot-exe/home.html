<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>MonBot</title>
<style>
:root{--bg:#0f0b1a;--card:#1b1530;--txt:#f3f0ff;--mut:#a59cc4;--acc:#7c3aed;--err:#f87171;--ok:#4ade80}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:18px;padding:36px;width:min(460px,92vw);box-shadow:0 20px 60px #0008}
h1{margin:0 0 4px;font-size:28px}p{color:var(--mut);margin:0 0 22px;line-height:1.45}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #3a2f5c;background:#120d22;color:var(--txt);font-size:15px;outline:none}
input:focus{border-color:var(--acc)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;cursor:pointer;color:#fff;background:var(--acc);font-weight:600}
button.sec{background:#2c2347;font-weight:500}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:22px;margin-top:14px;font-size:14px}.err{color:var(--err)}.ok{color:var(--ok)}
.tip{font-size:12.5px;color:var(--mut);margin-top:18px;border-top:1px solid #2c2347;padding-top:14px;line-height:1.5}
kbd{background:#2c2347;border-radius:5px;padding:1px 6px}
</style></head><body>
<div class="card">
  <h1>🤖 MonBot</h1>
  <p>Ouvre le panel de ton bot. Mets l'adresse que MonBot t'a envoyée en MP, ou <b>localhost:3000</b> si le bot tourne sur ce PC.</p>
  <label for="a">Adresse du bot</label>
  <input id="a" placeholder="https://….trycloudflare.com" autocomplete="off" spellcheck="false">
  <div class="row">
    <button id="go">Se connecter</button>
    <button class="sec" id="local">Bot sur ce PC</button>
  </div>
  <div id="msg"></div>
  <div class="tip">Ta clé du panel se demande à l'écran suivant et reste retenue.<br>Pour changer d'adresse plus tard : appuie sur <kbd>F2</kbd> n'importe où dans l'appli.</div>
</div>
<script>
const a=document.getElementById('a'),msg=document.getElementById('msg'),go=document.getElementById('go');
function say(t,c){msg.textContent=t;msg.className=c||''}
async function connectTo(v){
  if(!v.trim()){say("Colle d'abord l'adresse du bot.",'err');a.focus();return}
  go.disabled=true;say('Connexion…');
  try{await window.connect(v)}catch(x){say(String(x),'err');go.disabled=false}
}
go.onclick=()=>connectTo(a.value);
document.getElementById('local').onclick=()=>{a.value='http://localhost:3000';connectTo(a.value)};
a.addEventListener('keydown',e=>{if(e.key==='Enter')connectTo(a.value)});
window.onResult=(t,c)=>{say(t,c);if(c==='err')go.disabled=false};
window.addEventListener('load',async()=>{try{const s=await window.saved();if(s)a.value=s;window.autostart()}catch(_){}a.focus()});
</script></body></html>
