<style>
/* Layout: plein écran "en jeu" — monde 3D derrière, HUD fin par-dessus, menu K en panneau flottant */
:root {
  --ink: #f3efff;
  --ink-dim: #b9b0d6;
  --ink-faint: #7d7499;
  --panel: rgba(20, 15, 36, 0.86);
  --panel-solid: #17112a;
  --line: rgba(196, 176, 255, 0.16);
  --accent: #b89cff;
  --accent-ink: #1b1233;
  --done: #7ee2a8;
  --doing: #ffd36b;
  --todo: #8d84ad;
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: #120d22;
  color: var(--ink);
  font-family: var(--f-ui);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
#world { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#world.drag { cursor: grabbing; }

/* ---------- HUD ---------- */
.hud-top {
  position: fixed; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: flex; justify-content: center; pointer-events: none; z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar {
  display: flex; align-items: center; gap: 10px;
  max-width: min(560px, 100%); min-width: 0;
  padding: 5px 12px 5px 5px; border-radius: 999px;
  background: rgba(14, 10, 26, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 6px 24px rgba(0,0,0,.25);
  transition: opacity .3s;
}
.topbar[data-off="1"] { opacity: 0; }
.disc {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 50% 50%, #120d22 0 18%, transparent 19%), conic-gradient(from 0deg, var(--accent), #ff9ed8, #ffd36b, var(--accent));
  animation: spin 6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.barline { font-family: "Poppins", var(--f-ui); font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; letter-spacing: .01em; }
.barline .w { color: rgba(255,255,255,.42); transition: color .2s; padding: 1px 2px; border-radius: 5px; }
.barline .w.sung { color: #fff; }
.barline .w.cur { color: var(--accent-ink); background: var(--accent); }
.barline .meta { color: var(--ink-dim); font-weight: 400; }
.eq { display: flex; align-items: flex-end; gap: 2px; height: 12px; flex: none; }
.eq i { width: 3px; background: var(--accent); border-radius: 1px; animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; } .eq i:nth-child(4) { animation-delay: -.15s; }
@keyframes eq { 0%,100% { height: 3px; } 50% { height: 12px; } }
.paused .eq i, .paused .disc { animation-play-state: paused; }

.crosshair { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,.85); font: 400 22px/1 var(--f-ui); pointer-events: none; z-index: 4; text-shadow: 0 0 2px rgba(0,0,0,.6); }

.corner { position: fixed; z-index: 6; display: flex; gap: 8px; align-items: center; }
.tl { top: calc(env(safe-area-inset-top, 0px) + 54px); left: max(16px, env(safe-area-inset-left, 0px)); }
.br { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px)); }
.bl { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px)); align-items: flex-end; }

.chip { font: 500 11px/1 var(--f-ui); color: var(--ink-dim); background: rgba(14,10,26,.6); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 6px 10px; letter-spacing: .02em; }
.chip b { color: var(--ink); font-weight: 600; }
kbd { font: 600 10px/1 var(--f-ui); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--ink); }

.btn {
  font: 600 13px/1 var(--f-ui); color: var(--ink); background: rgba(20,15,36,.8);
  border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 10px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .seg button:focus-visible, .card:focus-visible, .tab:focus-visible, .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* ---------- Journal (build log) ---------- */
.log {
  width: min(330px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow: hidden;
}
.log header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; cursor: pointer; }
.log h2 { margin: 0; font: 700 13px/1.2 var(--f-head); letter-spacing: .02em; }
.log .sub { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
.progress { height: 4px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; margin: 0 12px 10px; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--done), var(--accent)); border-radius: 4px; transition: width .6s; }
.log ul { list-style: none; margin: 0; padding: 0 12px 12px; display: grid; gap: 7px; max-height: 38vh; overflow: auto; }
.log li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; font-size: 12px; line-height: 1.35; color: var(--ink-dim); }
.log li strong { color: var(--ink); font-weight: 600; display: block; }
.pill { font: 600 10px/1 var(--f-ui); text-transform: uppercase; letter-spacing: .06em; padding: 4px 0; border-radius: 6px; text-align: center; align-self: start; }
.pill.done { background: rgba(126,226,168,.16); color: var(--done); }
.pill.doing { background: rgba(255,211,107,.16); color: var(--doing); }
.pill.todo { background: rgba(141,132,173,.14); color: var(--todo); }
.log[data-collapsed="1"] ul, .log[data-collapsed="1"] .progress { display: none; }
.caret { color: var(--ink-faint); font-size: 12px; }

/* ---------- Menu K ---------- */
.menu-wrap[hidden] { display: none; }
.menu-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(8,5,16,.35); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.menu {
  width: min(780px, 100%); height: min(520px, 100%); display: grid; grid-template-columns: 170px 1fr;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.side { background: rgba(255,255,255,.03); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 14px; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #ff9ed8); display: grid; place-items: center; font: 700 14px/1 var(--f-head); color: var(--accent-ink); flex: none; }
.brand b { font: 700 15px/1.1 var(--f-head); display: block; }
.brand small { font-size: 10px; color: var(--ink-faint); }
.tab { text-align: left; font: 500 13px/1 var(--f-ui); color: var(--ink-dim); background: none; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
.tab:hover { background: rgba(255,255,255,.05); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.side .grow { flex: 1; }
.side .ver { font-size: 10px; color: var(--ink-faint); padding: 0 8px; }
.content { padding: 18px 20px; overflow: auto; min-width: 0; }
.content h3 { margin: 0; font: 700 18px/1.2 var(--f-head); }
.content .lead { margin: 4px 0 16px; color: var(--ink-faint); font-size: 12px; }
.section-label { font: 600 10px/1 var(--f-ui); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-faint); margin: 18px 0 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.025); margin-bottom: 6px; }
.row .t { font-size: 13px; font-weight: 500; }
.row .d { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
.row > div:first-child { min-width: 0; }
.toggle { width: 38px; height: 22px; border-radius: 999px; background: rgba(255,255,255,.14); border: 0; position: relative; cursor: pointer; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(16px); }
.seg { display: inline-flex; background: rgba(255,255,255,.06); border-radius: 8px; padding: 3px; gap: 2px; flex: none; flex-wrap: wrap; }
.seg button { font: 600 11px/1 var(--f-ui); color: var(--ink-dim); background: none; border: 0; border-radius: 6px; padding: 7px 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
input[type=range] { accent-color: #b89cff; width: 150px; max-width: 40vw; }
.val { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-dim); min-width: 52px; text-align: right; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.03); padding: 10px; cursor: pointer; text-align: center; color: var(--ink); font: inherit; min-width: 0; }
.card:hover { border-color: rgba(184,156,255,.5); }
.card[aria-pressed="true"] { border-color: var(--accent); background: rgba(184,156,255,.14); box-shadow: inset 0 0 0 1px var(--accent); }
.card .sample { font-size: 22px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .name { font-size: 11px; color: var(--ink-dim); margin-top: 4px; }
.sky-card { padding: 0; overflow: hidden; text-align: left; }
.sky-card canvas { display: block; width: 100%; aspect-ratio: 2 / 1; max-width: 100%; }
.sky-card .name { padding: 7px 9px; margin: 0; }
.np { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.03); }
.np .art { width: 64px; height: 64px; border-radius: 10px; background: conic-gradient(from 210deg, #ff9e6b, #b89cff, #6bc8ff, #ff9e6b); }
.np .ti { font: 700 15px/1.2 var(--f-head); }
.np .ar { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
.np .status { display: inline-block; margin-top: 8px; font: 600 10px/1 var(--f-ui); padding: 4px 7px; border-radius: 5px; background: rgba(126,226,168,.16); color: var(--done); letter-spacing: .04em; text-transform: uppercase; }
.bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); margin-top: 10px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.times { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-faint); margin-top: 4px; font-variant-numeric: tabular-nums; }
textarea { width: 100%; min-height: 110px; resize: vertical; background: rgba(0,0,0,.25); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 12px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; box-sizing: border-box; user-select: text; }
.note { font-size: 11px; color: var(--ink-faint); margin-top: 6px; line-height: 1.5; }
.close { position: absolute; }
.menu-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.x { background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--ink-dim); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 16px; line-height: 1; flex: none; }
.x:hover { color: var(--ink); }

@media (max-width: 640px) {
  .menu { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: min(620px, 100%); }
  .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
  .brand, .side .grow, .side .ver { display: none; }
  .tab { white-space: nowrap; }
  .tl { display: none; }
  .barline { font-size: 12px; }
  .row { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  .disc, .eq i { animation: none; }
}
</style>

<script>

/* =========================================================================
   Journal du mod — mis à jour à chaque étape du développement du .jar
   ========================================================================= */

// Ciels : dégradé par élévation (-1 bas … 1 zénith), nuages/nébuleuse, étoiles, aurore, soleil
const SKIES = [
  { id: "sunset", name: "Coucher de soleil", horizon: "#f2a35e",
    stops: [[-1, "#7a3d22"], [-0.05, "#e8935a"], [0.02, "#f6ae68"], [0.25, "#e5813e"], [0.6, "#cf6a2f"], [1, "#b4522a"]],

    nebula: { a: "#d24bd8", b: "#6a3cff", amount: 0.85, scale: 1.6 }, stars: 0.0045 },
  { id: "aurora", name: "Aurore", horizon: "#123c4a",
    stops: [[-1, "#06141c"], [0, "#123c4a"], [0.2, "#0b2733"], [1, "#040b16"]],

      const rise = (1 - ease(p)) * FONT_PX * 0.45 + (this.dieAt ? (now - this.dieAt) * 0.05 : 0);
      const x0 = w.lx, y0 = w.ly + rise;
      let x = x0 * ct - y0 * stl, y = x0 * stl + y0 * ct;
      y += this.bend * x * x;
      const roll = this.tilt + Math.atan(2 * this.bend * x);
      const wy = this.anchorYaw - x * k / D, wp = this.anchorPitch - y * k / D;
      w.mesh.position.copy(camera.position).add(dirFrom(wy, wp).multiplyScalar(D));
      w.mesh.lookAt(camera.position); w.mesh.rotateZ(-roll);
      const s = (0.55 + 0.45 * back(p)) * k;
      w.mesh.scale.set(w.canvas.width * s, w.canvas.height * s, 1);
      w.mat.opacity = ease(p) * fade;
      w.mat.depthTest = !float; w.mesh.renderOrder = float ? 20 : 1;
    });
    return fade > 0;
  }
  die(now) { if (!this.dieAt) this.dieAt = now; }
  dispose() { scene.remove(this.group); this.words.forEach(w => w.dispose()); }
}

let lines = [], curIdx = -2;
function resetLyrics() { lines.forEach(l => l.dispose()); lines = []; curIdx = -2; }

/* ===================== Barre du haut ===================== */
const barEl = document.getElementById("barline"), topbar = document.getElementById("topbar");
let barKey = "";
function updateBar(t, idx) {
  topbar.dataset.off = cfg.topBar ? "0" : "1";
  const line = idx >= 0 ? track.lines[idx] : null;
  if (!line || !line.words.length || t > line.end + 1500) {
    const k = "meta"; if (barKey !== k) { barKey = k; barEl.innerHTML = ""; const s = document.createElement("span"); s.className = "meta"; s.textContent = track.title + " · " + track.artist; barEl.appendChild(s); }
    return;
  }
  let cur = -1; line.words.forEach((w, i) => { if (t >= w.start) cur = i; });
  const k = idx + ":" + cur; if (k === barKey) return; barKey = k;
  barEl.innerHTML = "";
  line.words.forEach((w, i) => { const s = document.createElement("span"); s.className = "w" + (i < cur ? " sung" : i === cur ? " cur" : ""); s.textContent = w.text; barEl.appendChild(s); barEl.appendChild(document.createTextNode(" ")); });
}
function applyAccent() { document.documentElement.style.setProperty("--accent", style().accent); }

/* ===================== Contrôles caméra ===================== */
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => { if (!dragging) return; yaw += (e.clientX - lx) * 0.0045; pitch = Math.max(-1.2, Math.min(1.3, pitch + (e.clientY - ly) * 0.0045)); lx = e.clientX; ly = e.clientY; lastInput = performance.now(); });
const endDrag = () => { dragging = false; canvas.classList.remove("drag"); };
canvas.addEventListener("pointerup", endDrag); canvas.addEventListener("pointercancel", endDrag);
window.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
  if (e.key === "k" || e.key === "K") toggleMenu();
  else if (e.key === "Escape") toggleMenu(false);
  else if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
});

/* ===================== Boucle ===================== */
function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener("resize", resize); resize();
let frames = 0, fpsT = performance.now();
const fpsEl = document.getElementById("fps");
function loop(now) {
  if (now - lastInput > 3500 && !dragging) yaw += 0.0009;
  camera.rotation.set(pitch, yaw, 0);
  skyMesh.position.copy(camera.position);
  const t = songTime();
  const idx = cfg.lyrics ? lineAt(t) : -1;
  if (idx !== curIdx) {
    lines.forEach(l => l.die(now));
    const ln = idx >= 0 ? track.lines[idx] : null;
    if (ln && ln.words.length) lines.push(new LineFx(ln));
    curIdx = idx;
  }
  const cur = idx >= 0 ? track.lines[idx] : null;
  if (cur && t > cur.end + 1500) lines.forEach(l => l.die(now));
  lines = lines.filter(l => { const alive = l.update(t, now); if (!alive) l.dispose(); return alive; });
  updateBar(t, cfg.lyrics ? idx : -1);
  renderer.render(scene, camera);
  frames++; if (now - fpsT > 1000) { fpsEl.textContent = frames; frames = 0; fpsT = now; }
  if (menuOpen && currentTab === "overview") updateOverview();
  requestAnimationFrame(loop);
}

/* ===================== Journal ===================== */
function renderLog() {
  const done = BUILD.items.filter(i => i.s === "done").length;
  document.getElementById("logSub").textContent = BUILD.updated + " · " + done + "/" + BUILD.items.length + " fait";
  document.getElementById("logBar").style.width = (100 * (done + 0.5 * BUILD.items.filter(i => i.s === "doing").length) / BUILD.items.length) + "%";
  const ul = document.getElementById("logList"); ul.innerHTML = "";
  BUILD.items.forEach(i => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="pill ${i.s}">${i.s === "done" ? "Fait" : i.s === "doing" ? "En cours" : "À venir"}</span><div><strong></strong><span></span></div>`;
    li.querySelector("strong").textContent = i.t; li.querySelector("span:last-child").textContent = i.d; ul.appendChild(li);
  });
}
const logEl = document.getElementById("log"), logHead = document.getElementById("logHead");
function toggleLog() { const c = logEl.dataset.collapsed === "1" ? "0" : "1"; logEl.dataset.collapsed = c; logHead.setAttribute("aria-expanded", c === "0"); document.getElementById("caret").textContent = c === "1" ? "▸" : "▾"; try { localStorage.setItem("skylyrics-log", c); } catch (e) {} }
logHead.addEventListener("click", toggleLog);
logHead.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleLog(); } });
try { if (localStorage.getItem("skylyrics-log") === "1" || window.innerWidth < 640) toggleLog(); } catch (e) {}

/* ===================== Menu K ===================== */
const wrap = document.getElementById("menuWrap"), content = document.getElementById("content");
let menuOpen = false, currentTab = "lyrics";
function toggleMenu(force) { menuOpen = force === undefined ? !menuOpen : force; wrap.hidden = !menuOpen; if (menuOpen) showTab(currentTab); }
document.getElementById("menuBtn").addEventListener("click", () => toggleMenu(true));
document.getElementById("playBtn").addEventListener("click", () => setPlaying(!playing));
wrap.addEventListener("click", e => { if (e.target === wrap) toggleMenu(false); });
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

function el(tag, attrs, ...kids) { const e = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === "on") for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); else if (k === "style") e.style.cssText = attrs[k]; else if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); } kids.forEach(k => k && e.appendChild(typeof k === "string" ? document.createTextNode(k) : k)); return e; }
function head(title, lead) { return el("div", { class: "menu-head" }, el("div", null, el("h3", { text: title }), el("p", { class: "lead", text: lead })), el("button", { class: "x", type: "button", "aria-label": "Fermer", text: "×", on: { click: () => toggleMenu(false) } })); }
function set(k, v, rebuild) { cfg[k] = v; save(); if (rebuild !== false) resetLyrics(); applySky(); applyAccent(); showTab(currentTab); }
function toggleRow(id, label, desc, key) {
  return el("div", { class: "row" }, el("div", null, el("div", { class: "t", text: label }), el("div", { class: "d", text: desc })),
    el("button", { class: "toggle", id, type: "button", role: "switch", "aria-checked": String(!!cfg[key]), "aria-label": label, on: { click: () => set(key, !cfg[key]) } }));
}
function segRow(label, desc, key, opts) {
  const seg = el("div", { class: "seg" });
  opts.forEach(([v, n]) => seg.appendChild(el("button", { type: "button", "aria-pressed": String(cfg[key] === v), text: n, on: { click: () => set(key, v) } })));
  return el("div", { class: "row" }, el("div", null, el("div", { class: "t", text: label }), el("div", { class: "d", text: desc })), seg);
}
function sliderRow(id, label, desc, key, min, max, step, fmt) {
  const val = el("span", { class: "val", text: fmt(cfg[key]) });
  const input = el("input", { type: "range", id, min, max, step, value: cfg[key], "aria-label": label, on: { input: e => { cfg[key] = +e.target.value; val.textContent = fmt(cfg[key]); save(); } } });
  return el("div", { class: "row" }, el("div", null, el("div", { class: "t", text: label }), el("div", { class: "d", text: desc })), el("div", { style: "display:flex;align-items:center;gap:8px" }, input, val));
}
const mmss = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

let ovRefs = null;
function updateOverview() {
  if (!ovRefs) return; const t = songTime() - cfg.offset, L = trackLength();
  ovRefs.bar.style.width = (100 * t / L) + "%"; ovRefs.cur.textContent = mmss(t); ovRefs.len.textContent = mmss(L);
}
function showTab(tab) {
  currentTab = tab; ovRefs = null;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  content.innerHTML = ""; content.scrollTop = 0;
  if (tab === "overview") {
    content.appendChild(head("Aperçu", "Ce que le mod lit en ce moment dans Spotify."));
    const bar = el("span"), cur = el("span"), len = el("span");
    content.appendChild(el("div", { class: "np" }, el("div", { class: "art" }), el("div", { style: "min-width:0" },
      el("div", { class: "ti", text: track.title }), el("div", { class: "ar", text: track.artist }),
      el("span", { class: "status", text: "Paroles synchronisées" }),
      el("div", { class: "bar" }, bar), el("div", { class: "times" }, cur, len))));
    ovRefs = { bar, cur, len }; updateOverview();
    content.appendChild(el("div", { class: "section-label", text: "Tester tes propres paroles" }));
    const ta = el("textarea", { id: "lrcInput", placeholder: "[00:12.30] Colle ici des paroles au format .lrc\n[00:15.80] (lrclib.net en propose pour presque tous les sons)" });
    content.appendChild(ta);
    content.appendChild(el("div", { style: "display:flex;gap:8px;margin-top:8px;flex-wrap:wrap" },
      el("button", { class: "btn primary", type: "button", text: "Jouer ces paroles", on: { click: () => { const l = parseLrc(ta.value); if (l.length) { track = { title: "Tes paroles", artist: "Collées à la main", lines: l }; resetLyrics(); restartTrack(); setPlaying(true); toggleMenu(false); } else { note.textContent = "Aucune ligne [mm:ss.xx] trouvée. Vérifie le format .lrc."; } } } }),
      el("button", { class: "btn", type: "button", text: "Revenir à la démo", on: { click: () => { track = { title: "Lanterns Over the Bay", artist: "SkyLyrics Demo", lines: demoLines() }; resetLyrics(); restartTrack(); showTab("overview"); } } })));
    const note = el("p", { class: "note", text: "Dans le jeu, le mod fait ça tout seul : il lit le son en cours dans Spotify et télécharge les paroles." });
    content.appendChild(note);
  } else if (tab === "lyrics") {
    content.appendChild(head("Paroles", "Les paroles de Spotify en 3D dans le ciel."));
    content.appendChild(el("div", { class: "section-label", text: "Général" }));
    content.appendChild(toggleRow("tLyrics", "Paroles activées", "Lit le son en cours dans Spotify.", "lyrics"));
    content.appendChild(segRow("Affichage", cfg.display === "sky" ? "Les mots apparaissent dans le ciel. Les blocs devant les cachent." : "Les paroles flottent devant toi, où que tu regardes (idéal en PvP).", "display", [["sky", "Ciel"], ["float", "Flottant"]]));
    content.appendChild(segRow("Animation", "Comment les paroles arrivent.", "anim", [["word", "Mot par mot"], ["letter", "Lettre"], ["line", "Ligne"]]));
    content.appendChild(toggleRow("tBar", "Barre du haut", "Affiche la ligne en cours avec le mot chanté surligné.", "topBar"));
    content.appendChild(el("div", { class: "section-label", text: "Réglages fins" }));
    content.appendChild(sliderRow("sScale", "Taille du texte", "Grossit les mots dans le ciel.", "scale", 0.5, 2, 0.05, v => "×" + v.toFixed(2)));
    content.appendChild(sliderRow("sDist", "Distance", "À combien de blocs les paroles apparaissent.", "distance", 16, 64, 1, v => v + " blocs"));
    content.appendChild(sliderRow("sOff", "Décalage de synchro", "Si les paroles sont en retard ou en avance.", "offset", -2000, 2000, 50, v => (v > 0 ? "+" : "") + v + " ms"));
  } else if (tab === "styles") {
    content.appendChild(head("Styles", "Couleur, lueur et police des paroles."));
    content.appendChild(el("div", { class: "section-label", text: "Look" }));
    const g = el("div", { class: "grid" });
    STYLES.forEach(s => g.appendChild(el("button", { class: "card", type: "button", "aria-pressed": String(cfg.style === s.id), on: { click: () => set("style", s.id) } },
      el("div", { class: "sample", style: `font:${fontCss(s.font, 22)};color:${s.color};text-shadow:0 0 10px ${s.glow},0 0 3px ${s.glow}`, text: "Aa" }), el("div", { class: "name", text: s.name }))));
    content.appendChild(g);
    content.appendChild(el("div", { class: "section-label", text: "Police" }));
    const f = el("div", { class: "grid" });
    f.appendChild(el("button", { class: "card", type: "button", "aria-pressed": String(!cfg.font), on: { click: () => set("font", "") } }, el("div", { class: "sample", style: `font:${fontCss(style().font, 18)}`, text: "Auto" }), el("div", { class: "name", text: "Celle du style" })));
    Object.keys(FONTS).forEach(id => f.appendChild(el("button", { class: "card", type: "button", "aria-pressed": String(cfg.font === id), on: { click: () => set("font", id) } },
      el("div", { class: "sample", style: `font:${fontCss(id, 18)}`, text: FONTS[id].name }), el("div", { class: "name", text: "Police" }))));
    content.appendChild(f);
  } else if (tab === "skies") {
    content.appendChild(head("Ciels", "Remplace le ciel du jeu. Le brouillard s’accorde à l’horizon."));
    content.appendChild(toggleRow("tSky", "Ciel personnalisé", "Désactivé, tu gardes le ciel normal du jeu.", "skyOn"));
    const g = el("div", { class: "grid", style: "margin-top:10px" });
    SKIES.forEach(s => { const cv = paintSky(s, 128, 64); g.appendChild(el("button", { class: "card sky-card", type: "button", "aria-pressed": String(cfg.skyOn && cfg.sky === s.id), on: { click: () => { cfg.skyOn = true; set("sky", s.id, false); } } }, cv, el("div", { class: "name", text: s.name }))); });
    content.appendChild(g);
  } else if (tab === "journal") {
    content.appendChild(head("Journal", "Où en est le mod. Cette page se met à jour à chaque étape."));
    BUILD.items.forEach(i => content.appendChild(el("div", { class: "row" }, el("div", null, el("div", { class: "t", text: i.t }), el("div", { class: "d", text: i.d })), el("span", { class: "pill " + i.s, style: "padding:5px 8px", text: i.s === "done" ? "Fait" : i.s === "doing" ? "En cours" : "À venir" }))));
  }
}

/* ===================== Démarrage ===================== */
renderLog(); applySky(); applyAccent();
const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
Promise.race([ready, new Promise(r => setTimeout(r, 2500))]).then(() => {
  const loads = Object.keys(FONTS).map(id => document.fonts ? document.fonts.load(fontCss(id, 48)).catch(() => null) : null);
  Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 2500))]).then(() => { resetLyrics(); });
});
requestAnimationFrame(loop);
</script>
